<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frigo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#e8f0ef;--card:#fff;--ink:#12302d;--mute:#5d7673;--line:#c9dad7;--acc:#1b7f6e;--accink:#fff;--warn:#c4452d;--ok:#dff3ec}
@media (prefers-color-scheme:dark){:root{--bg:#0f1c1b;--card:#172a28;--ink:#e3f2ef;--mute:#8fb0ab;--line:#2a4440;--acc:#4fc3ad;--accink:#06201c;--warn:#ff8a73;--ok:#1c3a34}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 'Bricolage Grotesque',system-ui,sans-serif;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 84px)}
main{max-width:560px;margin:0 auto}
h1{font-size:30px;font-weight:800;margin:4px 0 2px;letter-spacing:-.5px}
h2{font-size:18px;margin:22px 0 8px}
p.s{color:var(--mute);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row label{flex:1;display:flex;align-items:center;gap:12px;cursor:pointer}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--acc);flex:none}
input[type=text],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.row input[type=text]{background:transparent;border-color:transparent;padding:6px}
.row input[type=text]:focus{border-color:var(--line);background:var(--bg)}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 16px;background:var(--acc);color:var(--accink);cursor:pointer}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.x{background:transparent;color:var(--warn);padding:6px 10px;font-size:20px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btns button{flex:1}
.out{border-bottom-color:var(--warn)}
.miss{color:var(--warn);font-weight:600}
.badge{font-size:13px;background:var(--ok);color:var(--ink);border-radius:20px;padding:2px 10px;font-weight:600;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips label{border:1px solid var(--line);border-radius:20px;padding:5px 12px;cursor:pointer;display:flex;gap:6px;align-items:center}
.chips input{width:16px;height:16px}
.add{display:flex;gap:8px;margin:10px 0}
.pills{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.pills button{flex:1;min-width:46px;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:9px 4px;position:relative}
.pills button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.pills button.has::after{content:"";position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.pills button.on.has::after{background:var(--accink)}
.mv{width:auto;max-width:112px;padding:8px 6px}
.row .g{padding:8px 10px;white-space:nowrap}
.day{padding:10px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day b{display:block;margin-bottom:6px}
.meal{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.meal span{width:70px;color:var(--mute);font-size:14px;flex:none}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:transparent;color:var(--mute);border-radius:0;padding:14px 4px;font-size:14px}
nav button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.empty{color:var(--mute);padding:14px 0}
textarea{min-height:130px;resize:vertical}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const DAYS=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const MEALS=['Colazione','Pranzo','Cena'];
const TABS=[['check','Controllo'],['list','Lista'],['rec','Ricette'],['plan','Settimana']];
const uid=()=>Math.random().toString(36).slice(2,8);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function def(){
  const n=['Latte','Uova','Yogurt','Burro','Mozzarella','Petto di pollo','Insalata','Verdura fresca','Frutta','Prosciutto'];
  return{items:n.map(x=>({id:uid(),n:x})),present:{},recipes:[],wk:[],phone:''};
}
function load(){try{const d=JSON.parse(localStorage.getItem('frigo'))||def();
 if(!d.wk)d.wk=Object.entries(d.plan||{}).map(([k,rid])=>({id:uid(),rid,day:+k.split('-')[0]}));
 return d}catch(e){return def()}}
function save(){try{localStorage.setItem('frigo',JSON.stringify(S))}catch(e){}}
let S=load(),tab='check',pd=(new Date().getDay()+6)%7;
const name=id=>(S.items.find(i=>i.id===id)||{}).n||'';
const missing=()=>S.items.filter(i=>!S.present[i.id]);
function msg(){
  const m=missing();
  if(!m.length)return 'Spesa della settimana: in frigo c\'è già tutto!';
  return 'Spesa della settimana:\n'+m.map(i=>'- '+i.n).join('\n');
}
function render(){
  $nav();
  const a=document.getElementById('app');
  a.innerHTML=({check:vCheck,list:vList,rec:vRec,plan:vPlan})[tab]();
}
function $nav(){
  document.getElementById('nav').innerHTML=TABS.map(t=>`<button data-a="tab" data-v="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('');
}
function vCheck(){
  const m=missing();
  return `<h1>Controllo frigo</h1><p class="s">Spunta quello che hai. Il resto finisce nel messaggio.</p>
  <div class="card">${S.items.length?S.items.map(i=>`<div class="row"><label><input type="checkbox" data-a="pres" data-id="${i.id}" ${S.present[i.id]?'checked':''}>${esc(i.n)}</label></div>`).join(''):'<div class="empty">La lista è vuota. Aggiungi le cose dalla scheda Lista.</div>'}</div>
  <h2>Messaggio <span class="miss">(${m.length} da comprare)</span></h2>
  <textarea id="msg" aria-label="Messaggio">${esc(msg())}</textarea>
  <input type="text" id="phone" inputmode="tel" placeholder="Numero WhatsApp con prefisso, es. 39333… (facoltativo)" value="${esc(S.phone||'')}" style="margin-top:8px">
  <div class="btns"><button data-a="wa">Invia su WhatsApp</button><button class="g" data-a="copy">Copia</button><button class="g" data-a="reset">Azzera spunte</button></div>`;
}
function vList(){
  return `<h1>La mia lista</h1><p class="s">Le cose da avere sempre in frigo. Tocca un nome per modificarlo.</p>
  <div class="card">${S.items.length?S.items.map(i=>`<div class="row"><input type="text" data-a="ren" data-id="${i.id}" value="${esc(i.n)}" aria-label="Nome"><button class="x" data-a="del" data-id="${i.id}" aria-label="Elimina ${esc(i.n)}">×</button></div>`).join(''):'<div class="empty">Ancora niente. Aggiungi la prima cosa qui sotto.</div>'}</div>
  <div class="add"><input type="text" id="newitem" placeholder="Nuova voce, es. Hummus"><button data-a="add">Aggiungi</button></div>`;
}
function can(r){return r.ing.length&&r.ing.every(id=>S.present[id])}
function vRec(){
  return `<h1>Ricette</h1><p class="s">Ricette che puoi fare con gli ingredienti della lista.</p>
  <div class="card">${S.recipes.length?S.recipes.map(r=>`<div class="row"><div style="flex:1"><b>${esc(r.n)}</b><div class="s" style="margin:0;font-size:14px">${r.ing.map(name).map(esc).join(', ')||'nessun ingrediente'}</div></div>${can(r)?'<span class="badge">fattibile ora</span>':''}<button class="x" data-a="delrec" data-id="${r.id}" aria-label="Elimina ricetta">×</button></div>`).join(''):'<div class="empty">Nessuna ricetta. Creane una qui sotto.</div>'}</div>
  <h2>Nuova ricetta</h2>
  <input type="text" id="recname" placeholder="Nome, es. Frittata con verdure">
  <div class="chips">${S.items.map(i=>`<label><input type="checkbox" class="ri" value="${i.id}">${esc(i.n)}</label>`).join('')}</div>
  <div class="btns"><button data-a="addrec">Salva ricetta</button></div>`;
}
function vPlan(){
  if(!S.recipes.length)return `<h1>Settimana</h1><p class="s">Pianifica i pasti della settimana.</p><div class="card"><div class="empty">Prima crea almeno una ricetta nella scheda Ricette.</div></div>`;
  const used={};
  S.wk.forEach(e=>{const r=S.recipes.find(x=>x.id===e.rid);if(r)r.ing.forEach(i=>used[i]=(used[i]||0)+1)});
  const u=Object.entries(used).sort((a,b)=>b[1]-a[1]);
  const dayOpts=cur=>DAYS.map((d,i)=>`<option value="${i}" ${i===cur?'selected':''}>${d}</option>`).join('');
  const recOpts=S.recipes.map(r=>`<option value="${r.id}">${esc(r.n)}</option>`).join('');
  return `<h1>Settimana</h1><p class="s">Aggiungi ricette a qualsiasi giorno e spostale quando vuoi.</p>
  <div class="btns"><button data-a="rand">Riempi a caso</button><button class="g" data-a="clr">Svuota</button></div>
  ${DAYS.map((d,di)=>{const es=S.wk.filter(e=>e.day===di);
    return `<h2>${d} <span class="s" style="font-weight:400;font-size:14px">${es.length} ${es.length===1?'pasto':'pasti'}</span></h2><div class="card">`+
    (es.map(e=>{const r=S.recipes.find(x=>x.id===e.rid);
      return `<div class="row"><b style="flex:1;min-width:0">${esc(r?r.n:'Ricetta eliminata')}</b><select class="mv" data-a="mv" data-id="${e.id}" aria-label="Sposta a un altro giorno">${dayOpts(di)}</select>${di<6?`<button class="g" data-a="cp" data-id="${e.id}" aria-label="Copia al giorno dopo" title="Copia al giorno dopo">Copia ›</button>`:''}<button class="x" data-a="rm" data-id="${e.id}" aria-label="Rimuovi">×</button></div>`}).join('')||'<div class="empty">Nessun pasto.</div>')+
    `<div class="row"><select data-a="addwk" data-day="${di}" aria-label="Aggiungi ricetta a ${d}"><option value="">+ Aggiungi ricetta…</option>${recOpts}</select></div></div>`}).join('')}
  <h2>Ingredienti usati</h2>
  <div class="card">${u.length?u.map(([id,c])=>`<div class="row"><span style="flex:1">${esc(name(id))}</span><span class="s" style="margin:0">${c} ${c===1?'pasto':'pasti'}</span></div>`).join(''):'<div class="empty">Aggiungi qualche pasto per vedere cosa serve.</div>'}</div>`;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.tagName==='INPUT'||b.tagName==='SELECT')return;
  const a=b.dataset.a,id=b.dataset.id;
  if(a==='tab'){tab=b.dataset.v;render();window.scrollTo(0,0);}
  else if(a==='cp'){const e=S.wk.find(x=>x.id===id);if(e&&e.day<6){S.wk.push({id:uid(),rid:e.rid,day:e.day+1});save();render();}}
  else if(a==='rm'){S.wk=S.wk.filter(x=>x.id!==id);save();render();}
  else if(a==='wa'){
    const t=document.getElementById('msg').value,p=(S.phone||'').replace(/\D/g,'');
    window.open('https://wa.me/'+p+'?text='+encodeURIComponent(t),'_blank');
  }
  else if(a==='copy'){
    const t=document.getElementById('msg').value;
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{b.textContent='Copiato'},()=>{document.getElementById('msg').select();b.textContent='Seleziona e copia'});
  }
  else if(a==='reset'){S.present={};save();render();}
  else if(a==='add'){
    const i=document.getElementById('newitem'),v=i.value.trim();if(!v)return;
    S.items.push({id:uid(),n:v});save();render();document.getElementById('newitem').focus();
  }
  else if(a==='del'){
    S.items=S.items.filter(i=>i.id!==id);S.recipes.forEach(r=>r.ing=r.ing.filter(x=>x!==id));delete S.present[id];save();render();
  }
  else if(a==='addrec'){
    const n=document.getElementById('recname').value.trim();
    const ing=[...document.querySelectorAll('.ri:checked')].map(c=>c.value);
    if(!n||!ing.length){alert('Dai un nome alla ricetta e scegli almeno un ingrediente.');return;}
    S.recipes.push({id:uid(),n,ing});save();render();
  }
  else if(a==='delrec'){
    S.recipes=S.recipes.filter(r=>r.id!==id);
    S.wk=S.wk.filter(e=>e.rid!==id);save();render();
  }
  else if(a==='rand'){
    S.wk=[];for(let d=0;d<7;d++)for(let m=0;m<3;m++)S.wk.push({id:uid(),rid:S.recipes[Math.floor(Math.random()*S.recipes.length)].id,day:d});
    save();render();
  }
  else if(a==='clr'){S.wk=[];save();render();}
});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.a;
  if(a==='pres'){S.present[t.dataset.id]=t.checked;save();render();}
  else if(a==='ren'){const i=S.items.find(x=>x.id===t.dataset.id);if(i&&t.value.trim()){i.n=t.value.trim();save();}else render();}
  else if(a==='mv'){const e=S.wk.find(x=>x.id===t.dataset.id);if(e){e.day=+t.value;save();render();}}
  else if(a==='addwk'){if(t.value){S.wk.push({id:uid(),rid:t.value,day:+t.dataset.day});save();render();}}
  else if(t.id==='phone'){S.phone=t.value;save();}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='newitem')document.querySelector('[data-a=add]').click();});
render();
</script>
</body>
</html>
